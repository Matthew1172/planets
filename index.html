<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jol · Babylon.js</title>
    <style>
      body { margin: 0; }
      canvas { display: block; width: 100%; height: 100dvh; touch-action: none; }
      #texture-status {
        position: fixed;
        left: 1rem;
        bottom: 1rem;
        color: #edf5ff;
        background: #07101dd9;
        padding: .45rem .65rem;
        border-radius: .25rem;
        font: .8rem system-ui, sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="3D view of Jol, a sapphire ocean planet"></canvas>
    <output id="texture-status" hidden></output>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
